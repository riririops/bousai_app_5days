{% extends "base.html" %}

{% block content %}
<section class="dashboard-card">
    <div class="section-heading">
        <h2><span class="section-icon" aria-hidden="true">&#128205;</span>避難所マップ</h2>
    </div>
    <div id="shelterMap" style="height: 300px;"></div>
</section>

<section class="dashboard-card">
    <div class="section-heading">
        <h2><span class="section-icon" aria-hidden="true">&#9728;&#65039;&#9729;&#65039;</span>青森市 気象警報・注意報</h2>
        <span class="refresh-status" aria-label="10分おきに自動更新">&#8635; 10分おき自動更新</span>
    </div>
    <div id="weatherContent" class="weather-panel">
        <p>読み込み中...</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8221, 140.7474], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <p class="weather-result is-error">
                    <span class="weather-result-icon" aria-hidden="true">&#9888;</span>
                    気象情報の取得に失敗しました
                </p>
                <p class="weather-meta">
                    <span aria-hidden="true">&#128339;</span>
                    データ取得: ${data.last_fetch_time || '不明'}
                </p>
                <p class="weather-meta">
                    <span aria-hidden="true">&#128225;</span>
                    気象庁発表: ${data.report_time || '不明'}
                </p>
            `;
            return;
        }

        const hasWarnings = data.warnings && data.warnings.length > 0;
        let warningsHtml = '';
        if (hasWarnings) {
            warningsHtml = '<ul class="weather-warnings">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location">
                <span aria-hidden="true">&#128205;</span>
                ${data.area_name || '青森市'}
            </p>
            <p class="weather-result ${hasWarnings ? 'is-warning' : 'is-clear'}">
                <span class="weather-result-icon" aria-hidden="true">${hasWarnings ? '&#9888;' : '&#9989;'}</span>
                ${hasWarnings ? '現在、警報・注意報が発表されています' : '現在、警報・注意報は発表されていません'}
            </p>
            ${warningsHtml}
            <p class="weather-meta">
                <span aria-hidden="true">&#128339;</span>
                データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span>
            </p>
            <p class="weather-meta">
                <span aria-hidden="true">&#128225;</span>
                気象庁発表: ${data.report_time || '不明'}
            </p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
